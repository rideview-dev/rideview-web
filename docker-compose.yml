# Local PostgreSQL for RideView development.
#
#   docker compose up -d        # start Postgres in the background
#   docker compose down         # stop it (data is kept in the named volume)
#   docker compose down -v      # stop it AND wipe the data
#
# These credentials match the example below — put the matching DATABASE_URL in
# server/.env to connect:
#   DATABASE_URL=postgres://rideview:rideview@localhost:5432/rideview
#
# (Local dev only — choose a strong password for any real deployment.)

services:
  db:
    image: postgres:16-alpine
    container_name: rideview-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rideview
      POSTGRES_PASSWORD: rideview
      POSTGRES_DB: rideview
    ports:
      - "5432:5432"
    volumes:
      - rideview-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideview -d rideview"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rideview-pgdata:
